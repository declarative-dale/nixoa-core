# SPDX-License-Identifier: Apache-2.0
name: Queue trusted automation updates

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-automation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    name: Enable auto-merge for trusted update pull requests
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify and enqueue trusted updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pull_requests="$({
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --slurp
          })"

          jq -c \
            --arg branch "${DEFAULT_BRANCH}" \
            --arg repository "${GITHUB_REPOSITORY}" '
              add[] |
              select(.draft == false) |
              select(.head.repo.full_name == $repository) |
              select(.base.ref == $branch) |
              select(
                .user.login == "dependabot[bot]" or
                (
                  .head.ref == "automation/weekly-flake-input-refresh" and
                  .title == "flake.lock: refresh all inputs"
                )
              ) |
              {sha: .head.sha, url: .html_url}
            ' <<<"${pull_requests}" |
          while IFS= read -r pull_request; do
            head_sha=$(jq -er '.sha' <<<"${pull_request}")
            pr_url=$(jq -er '.url' <<<"${pull_request}")
            gh pr merge \
              --auto \
              --merge \
              --match-head-commit "${head_sha}" \
              "${pr_url}"
          done
