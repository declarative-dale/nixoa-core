# SPDX-License-Identifier: Apache-2.0
name: Queue trusted automation updates

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-automation
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  enqueue:
    name: Validate and enqueue trusted updates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Verify, validate, and enqueue updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: nix run .#nixoa-ci -- queue
