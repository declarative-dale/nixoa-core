# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 8 1 */2 *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run checks without planning installer artifacts
        required: false
        type: boolean
        default: false
      force_artifact:
        description: Rebuild and boot the installer even if state is reusable
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify installer changes
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      installer: ${{ steps.classify.outputs.installer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether installer validation is required
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
        shell: bash
        run: |
          set -euo pipefail
          installer=true
          case "${EVENT_NAME}" in
            pull_request)
              base_sha=${PR_BASE_SHA}
              head_sha=${PR_HEAD_SHA}
              ;;
            push)
              base_sha=${PUSH_BASE_SHA}
              head_sha=${PUSH_HEAD_SHA}
              if [[ "${base_sha}" == 0000000000000000000000000000000000000000 ]]; then
                base_sha=
              fi
              ;;
            schedule)
              base_sha=
              head_sha=
              ;;
            workflow_dispatch)
              if [[ "${VALIDATE_ONLY}" == true ]]; then
                installer=false
              fi
              base_sha=
              head_sha=
              ;;
            *)
              echo "Unknown event ${EVENT_NAME}; requiring installer validation." >&2
              base_sha=
              head_sha=
              ;;
          esac
          if [[ -n "${base_sha:-}" && -n "${head_sha:-}" ]]; then
            changed_paths=$(mktemp "${RUNNER_TEMP}/nixoa-changes.XXXXXX")
            if git diff --name-only "${base_sha}" "${head_sha}" >"${changed_paths}"; then
              installer=$(./ci/installer-changes.sh <"${changed_paths}")
            else
              echo 'Could not determine changed paths; requiring installer validation.' >&2
              installer=true
            fi
          fi
          if [[ "${FORCE_ARTIFACT}" == true ]]; then
            installer=true
          fi
          echo "installer=${installer}" >>"${GITHUB_OUTPUT}"

  check:
    name: Flake, source, workflow, and security checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://install.determinate.systems https://nixoa.cachix.org https://xen-orchestra-ce.cachix.org https://libvhdi-nixpkg.cachix.org
            extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixoa.cachix.org-1:N+GsSSd2yKgj2hx01fMG6Oe7tLfbxEi/V0oZFEB721g= xen-orchestra-ce.cachix.org-1:WAOajkFLXWTaFiwMbLidlGa5kWB7Icu29eJnYbeMG7E= libvhdi-nixpkg.cachix.org-1:HvYHKZcfczn2nGfCmd7F21E/MDZrlaXtN3p9mWAZT/4=

      - name: Enable the free GitHub-backed Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: enabled
          use-flakehub: disabled

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          ignore-missing-flake-lock: false
          fail-mode: true
          send-statistics: false

      - name: Validate repository
        run: nix flake check --accept-flake-config --print-build-logs

  plan:
    name: Plan immutable installer state
    needs:
      - changes
      - check
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_run_id: ${{ steps.state.outputs.artifact_run_id }}
      build_input: ${{ steps.state.outputs.build_input }}
      should_build: ${{ steps.state.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable installer state
        id: state
        env:
          ALLOW_REUSE: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_artifact != true)) && 'true' || 'false' }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: ./ci/find-installer-state.sh

      - name: Upload installer state pointer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-build-state
          path: nixoa-build-state.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build, attest, and boot installer
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://install.determinate.systems https://nixoa.cachix.org https://xen-orchestra-ce.cachix.org https://libvhdi-nixpkg.cachix.org
            extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixoa.cachix.org-1:N+GsSSd2yKgj2hx01fMG6Oe7tLfbxEi/V0oZFEB721g= xen-orchestra-ce.cachix.org-1:WAOajkFLXWTaFiwMbLidlGa5kWB7Icu29eJnYbeMG7E= libvhdi-nixpkg.cachix.org-1:HvYHKZcfczn2nGfCmd7F21E/MDZrlaXtN3p9mWAZT/4=

      - name: Enable the free GitHub-backed Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: enabled
          use-flakehub: disabled

      - name: Build installer and sbomnix inventories
        run: ./ci/build-release-assets.sh

      - name: Export the temporary reusable-output cache
        run: >-
          ./ci/reusable-cache.sh export
          "${GITHUB_WORKSPACE}/nixoa-reusable-cache"

      - name: Boot the installer ISO
        env:
          BOOT_LOG: ${{ runner.temp }}/qemu-boot.log
        run: >-
          nix shell --inputs-from . nixpkgs#qemu_kvm --command
          ./ci/boot-installer-iso.sh
          result-installer/iso/nixoa-installer.iso

      - name: Upload boot log after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-installer-boot-log
          path: ${{ runner.temp }}/qemu-boot.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Attest installer provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/nixoa-installer.iso

      - name: Bind the SPDX SBOM to the installer
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/nixoa-installer.iso
          sbom-path: nixoa-system.spdx.json

      - name: Download immutable build state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nixoa-build-state
          path: .

      - name: Upload installer and SBOM assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-installer
          path: |
            result-installer/iso/nixoa-installer.iso
            nixoa-installer.iso.sha256
            nixoa-system.spdx.json
            nixoa-system.spdx.json.sha256
            nixoa-system.cdx.json
            nixoa-system.cdx.json.sha256
            nixoa-build-state.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload the temporary reusable-output cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-reusable-cache
          path: nixoa-reusable-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish reusable main outputs
    needs:
      - changes
      - check
      - plan
      - build
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.installer == 'true' &&
      needs.check.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Download the exact temporary reusable-output cache
        id: reusable_cache
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: nixoa-reusable-cache
          path: nixoa-reusable-cache
          run-id: ${{ needs.plan.outputs.artifact_run_id }}

      - name: Restore verified reusable Nix closures
        if: steps.reusable_cache.outcome == 'success'
        run: >-
          ./ci/reusable-cache.sh restore
          "${GITHUB_WORKSPACE}/nixoa-reusable-cache"

      - name: Report an expired temporary cache
        if: steps.reusable_cache.outcome != 'success'
        run: echo 'The temporary closure cache is unavailable; rebuilding from configured public substituters.'

      - name: Install Cachix for retained package publishing
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'nixoa' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          skipAddingSubstituter: true

      - name: Build reusable outputs
        run: |
          nix build .#deploy-template -o result-deploy-template
          nix build .#metadata -o result-metadata
          nix build .#nixoa-menu -o result-nixoa-menu
          nix build .#nxcli -o result-nxcli

      - name: Push reusable package closures to Cachix
        continue-on-error: true
        env:
          CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'nixoa' }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo 'CACHIX_AUTH_TOKEN is unset; GitHub artifacts remain available.'
            exit 0
          fi
          readlink -f \
            result-deploy-template \
            result-metadata \
            result-nixoa-menu \
            result-nxcli |
            cachix push "${CACHE_NAME}"

      - name: Publish the rolling flake to FlakeHub
        continue-on-error: true
        uses: DeterminateSystems/flakehub-push@abcff4fb351e63f852f5fb2b9af0ae4e69de07d4 # main, Node.js 24 (post-v6)
        with:
          visibility: public
          name: declarative-dale/nixoa-core
          rolling: true
          rolling-minor: 2
          include-output-paths: true

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - check
      - plan
      - build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Enforce the conditional CI graph
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          EVENT_NAME: ${{ github.event_name }}
          INSTALLER_REQUIRED: ${{ needs.changes.outputs.installer }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SHOULD_BUILD: ${{ needs.plan.outputs.should_build }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CHECK_RESULT}" == success ]]
          if [[ "${INSTALLER_REQUIRED}" == true ]]; then
            [[ "${PLAN_RESULT}" == success ]]
            if [[ "${SHOULD_BUILD}" == true ]]; then
              [[ "${BUILD_RESULT}" == success ]]
            else
              [[ "${BUILD_RESULT}" == skipped ]]
            fi
          else
            [[ "${PLAN_RESULT}" == skipped ]]
            [[ "${BUILD_RESULT}" == skipped ]]
          fi
