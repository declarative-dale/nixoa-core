# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 8 1 */2 *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run checks without planning installer artifacts
        required: false
        type: boolean
        default: false
      force_artifact:
        description: Rebuild and boot the installer even if state is reusable
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate repository and prepare CI plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ contains(fromJSON('["pull_request","push","merge_group"]'), github.event_name) && '0' || '1' }}
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Prepare authoritative downstream CI plan
        id: plan
        env:
          ALLOW_REUSE: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_artifact != true)) && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ (github.event_name == 'schedule' || inputs.force_artifact == true) && 'true' || 'false' }}
          FORCE_ARTIFACT: ${{ inputs.force_artifact || false }}
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single ci:prepare

      - name: Validate repository
        run: nix run --accept-flake-config .#devenv -- tasks run ci:check

      - name: Upload installer state pointer
        if: fromJSON(steps.plan.outputs.plan).installer.required
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-build-state
          path: nixoa-build-state.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build, attest, and boot installer
    needs: prepare
    if: fromJSON(needs.prepare.outputs.plan).installer.build_required
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build installer and sbomnix inventories
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single ci:installer:build

      - name: Boot the installer ISO
        env:
          BOOT_LOG: ${{ runner.temp }}/qemu-boot.log
          INSTALLER_ISO: result-installer/iso/nixoa-installer.iso
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single ci:installer:boot

      - name: Upload boot log after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-installer-boot-log
          path: ${{ runner.temp }}/qemu-boot.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Attest installer provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/nixoa-installer.iso

      - name: Bind the SPDX SBOM to the installer
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/nixoa-installer.iso
          sbom-path: nixoa-system.spdx.json

      - name: Download immutable build state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nixoa-build-state
          path: .

      - name: Upload installer and SBOM assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-installer
          path: |
            result-installer/iso/nixoa-installer.iso
            nixoa-installer.iso.sha256
            nixoa-system.spdx.json
            nixoa-system.spdx.json.sha256
            nixoa-system.cdx.json
            nixoa-system.cdx.json.sha256
            nixoa-build-state.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Publish reusable main outputs
    needs:
      - prepare
      - build
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.plan).publish_required &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: nixoa-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Publish exact planned closures to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single ci:publish

      - name: Publish the rolling flake to FlakeHub
        uses: DeterminateSystems/flakehub-push@abcff4fb351e63f852f5fb2b9af0ae4e69de07d4 # main, Node.js 24 (post-v6)
        with:
          visibility: public
          name: declarative-dale/nixoa-core
          rolling: true
          rolling-minor: 2
          include-output-paths: true

  gate:
    name: CI gate
    if: always()
    needs:
      - prepare
      - build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Enforce the conditional CI graph
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CI_PLAN: ${{ needs.prepare.outputs.plan }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: nix run --accept-flake-config .#devenv -- tasks run --mode single ci:gate
