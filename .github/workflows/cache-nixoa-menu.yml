# SPDX-License-Identifier: Apache-2.0
name: Build NiXOA installer and release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cache-nixoa-menu.yml"
      - "ci/installer-build-input.sh"
      - "flake.lock"
      - "flake.nix"
      - "host/**"
      - "installer/**"
      - "modules/**"
      - "packer/**"
      - "pkgs/**"
      - "scripts/**"
      - "tests/**"
      - "!docs/**"
      - "!**/*.md"
      - "!**/README*"
      - "!**/CHANGELOG*"
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  plan:
    name: Reuse unchanged immutable installer state
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      artifact_run_id: ${{ steps.state.outputs.artifact_run_id }}
      build_input: ${{ steps.state.outputs.build_input }}
      should_build: ${{ steps.state.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find a matching immutable artifact
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_input=$(./ci/installer-build-input.sh)
          artifact_run_id=${GITHUB_RUN_ID}
          artifact_source_commit=${GITHUB_SHA}
          should_build=true

          while IFS= read -r run_id; do
            [[ "${run_id}" =~ ^[0-9]+$ ]] || continue
            state_dir=$(mktemp -d "${RUNNER_TEMP}/nixoa-state.XXXXXX")
            if gh run download "${run_id}" \
              --name nixoa-build-state \
              --dir "${state_dir}" >/dev/null 2>&1 &&
              jq -e \
                --arg build_input "${build_input}" \
                '.schema_version == 1 and .build_input == $build_input and (.artifact_run_id | type == "number")' \
                "${state_dir}/nixoa-build-state.json" >/dev/null; then
              candidate_run_id=$(jq -r .artifact_run_id \
                "${state_dir}/nixoa-build-state.json")
              candidate_source_commit=$(jq -r .artifact_source_commit \
                "${state_dir}/nixoa-build-state.json")
              available=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts" \
                --jq '.artifacts[] | select(.name == "nixoa-installer" and (.expired | not)) | .id' |
                head -n 1)
              if [[ -n "${available}" ]]; then
                artifact_run_id=${candidate_run_id}
                artifact_source_commit=${candidate_source_commit}
                should_build=false
                rm -rf -- "${state_dir}"
                break
              fi
            fi
            rm -rf -- "${state_dir}"
          done < <(
            gh run list \
              --workflow cache-nixoa-menu.yml \
              --branch main \
              --status completed \
              --limit 50 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          jq -n \
            --arg build_input "${build_input}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg artifact_source_commit "${artifact_source_commit}" \
            --argjson artifact_run_id "${artifact_run_id}" \
            '{schema_version:1,build_input:$build_input,source_commit:$source_commit,artifact_source_commit:$artifact_source_commit,artifact_run_id:$artifact_run_id}' \
            >nixoa-build-state.json
          {
            echo "artifact_run_id=${artifact_run_id}"
            echo "build_input=${build_input}"
            echo "should_build=${should_build}"
          } >>"${GITHUB_OUTPUT}"
          if [[ "${should_build}" == false ]]; then
            echo "Reusing immutable installer artifact from run ${artifact_run_id}."
          fi

      - name: Upload installer state pointer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-build-state
          path: nixoa-build-state.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build installer, packages, and system SBOMs
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://install.determinate.systems https://nixoa.cachix.org https://xen-orchestra-ce.cachix.org https://libvhdi-nixpkg.cachix.org
            extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixoa.cachix.org-1:N+GsSSd2yKgj2hx01fMG6Oe7tLfbxEi/V0oZFEB721g= xen-orchestra-ce.cachix.org-1:WAOajkFLXWTaFiwMbLidlGa5kWB7Icu29eJnYbeMG7E= libvhdi-nixpkg.cachix.org-1:HvYHKZcfczn2nGfCmd7F21E/MDZrlaXtN3p9mWAZT/4=

      - name: Enable the GitHub-backed Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: enabled
          use-flakehub: disabled

      - name: Install Cachix for retained package publishing
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'nixoa' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          skipAddingSubstituter: true

      - name: Verify public binary caches
        shell: bash
        run: |
          set -euo pipefail
          nix config show substituters
          nix config show trusted-public-keys
          determinate_out=$(nix eval --raw .#nixosConfigurations.nixoa.config.nix.package.upstream.outPath)
          nix path-info --store https://install.determinate.systems "${determinate_out}"
          xo_out=$(nix eval --raw .#packages.x86_64-linux.xen-orchestra-ce.outPath)
          nix path-info --store https://xen-orchestra-ce.cachix.org "${xo_out}"

      - name: Evaluate and check the flake
        run: |
          nix flake show --accept-flake-config --all-systems
          nix flake check --accept-flake-config --all-systems --no-build --print-build-logs

      - name: Build the appliance and reusable outputs
        run: |
          nix build \
            .#nixosConfigurations.nixoa.config.system.build.toplevel \
            .#packages.x86_64-linux.deploy-template \
            .#packages.x86_64-linux.libvhdi \
            .#packages.x86_64-linux.metadata \
            .#packages.x86_64-linux.nixoa-menu \
            .#packages.x86_64-linux.nxcli \
            .#packages.x86_64-linux.sbomnix \
            .#packages.x86_64-linux.xen-orchestra-ce \
            --no-link \
            --print-build-logs

      - name: Materialize reusable package outputs
        run: |
          nix build .#deploy-template -o result-deploy-template
          nix build .#metadata -o result-metadata
          nix build .#nixoa-menu -o result-nixoa-menu
          nix build .#nxcli -o result-nxcli

      - name: Build the unattended installer
        run: nix build .#installer-iso -o result-installer --print-build-logs

      - name: Generate runtime SBOMs with sbomnix
        shell: bash
        run: |
          set -euo pipefail
          sbomnix_out=$(nix build .#sbomnix --no-link --print-out-paths)
          sbom_work=$(mktemp -d "${RUNNER_TEMP}/nixoa-sbom.XXXXXX")
          (
            cd "${sbom_work}"
            "${sbomnix_out}/bin/sbomnix" \
              "path:${GITHUB_WORKSPACE}#nixosConfigurations.nixoa.config.system.build.toplevel"
          )
          mv "${sbom_work}/sbom.spdx.json" nixoa-system.spdx.json
          mv "${sbom_work}/sbom.cdx.json" nixoa-system.cdx.json
          jq -e '.spdxVersion | startswith("SPDX-")' nixoa-system.spdx.json >/dev/null
          jq -e '.bomFormat == "CycloneDX"' nixoa-system.cdx.json >/dev/null
          sha256sum nixoa-system.spdx.json >nixoa-system.spdx.json.sha256
          sha256sum nixoa-system.cdx.json >nixoa-system.cdx.json.sha256

      - name: Record installer checksum
        run: >-
          sha256sum result-installer/iso/nixoa-installer.iso
          > nixoa-installer.iso.sha256

      - name: Attest the installer build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result-installer/iso/nixoa-installer.iso

      - name: Download the immutable build state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nixoa-build-state
          path: .

      - name: Upload installer and SBOM assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixoa-installer
          path: |
            result-installer/iso/nixoa-installer.iso
            nixoa-installer.iso.sha256
            nixoa-system.spdx.json
            nixoa-system.spdx.json.sha256
            nixoa-system.cdx.json
            nixoa-system.cdx.json.sha256
            nixoa-build-state.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Push reusable package closures to Cachix
        continue-on-error: true
        env:
          CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'nixoa' }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "CACHIX_AUTH_TOKEN is unset; installer and SBOM artifacts remain available."
            exit 0
          fi
          out_paths=$(readlink -f \
            result-deploy-template \
            result-metadata \
            result-nixoa-menu \
            result-nxcli)
          printf '%s\n' "${out_paths}" | cachix push "${CACHE_NAME}"

      - name: Publish the rolling flake to FlakeHub
        continue-on-error: true
        uses: DeterminateSystems/flakehub-push@abcff4fb351e63f852f5fb2b9af0ae4e69de07d4 # main, Node.js 24 (post-v6)
        with:
          visibility: public
          name: declarative-dale/nixoa-core
          rolling: true
          rolling-minor: 2
          include-output-paths: true
