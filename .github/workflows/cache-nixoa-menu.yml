name: Cache NiXOA system

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cache-nixoa-menu.yml"
      - "docs/**"
      - "flake.lock"
      - "flake.nix"
      - "host/**"
      - "modules/**"
      - "pkgs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-nixoa-system:
    name: Build and push NiXOA closure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://install.determinate.systems https://nixoa.cachix.org https://xen-orchestra-ce.cachix.org https://libvhdi-nixpkg.cachix.org
            extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixoa.cachix.org-1:N+GsSSd2yKgj2hx01fMG6Oe7tLfbxEi/V0oZFEB721g= xen-orchestra-ce.cachix.org-1:WAOajkFLXWTaFiwMbLidlGa5kWB7Icu29eJnYbeMG7E= libvhdi-nixpkg.cachix.org-1:HvYHKZcfczn2nGfCmd7F21E/MDZrlaXtN3p9mWAZT/4=

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'nixoa' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          skipAddingSubstituter: true

      - name: Verify binary cache configuration
        run: |
          nix config show substituters
          nix config show trusted-public-keys
          determinate_out=$(nix eval --raw .#nixosConfigurations.nixoa.config.nix.package.upstream.outPath)
          nix path-info --store https://install.determinate.systems "$determinate_out"

      - name: Evaluate flake outputs
        run: nix flake show --all-systems

      - name: Check flake
        run: nix flake check --all-systems --no-build -L

      - name: Evaluate nixoa system
        run: nix eval --raw .#nixosConfigurations.nixoa.config.system.build.toplevel.drvPath

      - name: Build libvhdi input
        run: nix build .#packages.x86_64-linux.libvhdi -o result-libvhdi -L

      - name: Build package outputs
        run: |
          nix build .#packages.x86_64-linux.nxcli -o result-nxcli -L
          nix build .#packages.x86_64-linux.metadata -o result-metadata -L
          nix build .#packages.x86_64-linux.nixoa-menu -o result-nixoa-menu -L

      - name: Build NiXOA system
        run: nix build .#nixosConfigurations.nixoa.config.system.build.toplevel -o result-nixoa-system -L

      - name: Push NiXOA closures to Cachix
        env:
          CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'nixoa' }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "CACHIX_AUTH_TOKEN is required to publish the NiXOA closure." >&2
            exit 1
          fi

          out_paths=$(readlink -f \
            result-libvhdi \
            result-nxcli \
            result-metadata \
            result-nixoa-menu \
            result-nixoa-system)
          echo "Pushing NiXOA package and system closures:"
          printf '%s\n' "$out_paths"
          printf '%s\n' "$out_paths" | cachix push "$CACHE_NAME"
