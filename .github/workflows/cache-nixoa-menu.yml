name: Cache nixoa-menu

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cache-nixoa-menu.yml"
      - "docs/**"
      - "flake.lock"
      - "flake.nix"
      - "lib/**"
      - "modules/**"
      - "pkgs/nixoa-menu/**"
      - "pkgs/nxcli/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-nixoa-menu:
    name: Build and push nixoa-menu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
        continue-on-error: true

      - name: Evaluate flake outputs
        run: nix flake show --all-systems

      - name: Check flake
        run: nix flake check --all-systems --no-build -L

      - name: Evaluate example system
        run: nix eval --raw .#nixosConfigurations.nixo-ce-example.config.system.build.toplevel.drvPath

      - name: Build lightweight packages
        run: nix build .#packages.x86_64-linux.nxcli .#packages.x86_64-linux.metadata -L

      - name: Build nixoa-menu
        run: nix build .#packages.x86_64-linux.nixoa-menu -L

      - name: Push nixoa-menu result to Cachix
        if: vars.CACHIX_CACHE_NAME != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "CACHIX_AUTH_TOKEN is not configured; skipping Cachix push."
            exit 0
          fi

          out_path=$(readlink -f result)
          echo "Pushing built package output: $out_path"
          printf '%s\n' "$out_path" | cachix push "${{ vars.CACHIX_CACHE_NAME }}"
