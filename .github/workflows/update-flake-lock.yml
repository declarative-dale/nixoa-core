# SPDX-License-Identifier: Apache-2.0
name: Update Nix flake inputs

on:
  schedule:
    - cron: "17 9 * * 3"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  update:
    name: Refresh every locked input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Update the lock file and open a pull request
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/weekly-flake-input-refresh
          commit-msg: "flake.lock: refresh all inputs"
          pr-title: "flake.lock: refresh all inputs"
          pr-body: |
            Automated weekly refresh of every locked flake input.

            Required validation and protected-branch policy still apply.
