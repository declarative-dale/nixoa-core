# SPDX-License-Identifier: Apache-2.0
name: Update Nix flake inputs

on:
  schedule:
    - cron: "17 9 * * 3"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  update:
    name: Refresh every locked input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv and shared Nix caching
        uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          profile: github-publish

      - name: Refresh native devenv inputs
        run: devenv --no-tui tasks run automation:update-locks

      - name: Refresh flake inputs and open one lock-file pull request
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/weekly-flake-input-refresh
          commit-msg: "locks: refresh Nix and devenv inputs"
          pr-title: "locks: refresh Nix and devenv inputs"
          pr-body: |
            Automated weekly refresh of every locked flake and devenv input.

            Required validation and protected-branch policy still apply.

      - name: Validate the synchronized lockfiles
        run: devenv --no-tui tasks run automation:validate-locks
